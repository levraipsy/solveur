<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solveur</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Solveur">
<meta name="theme-color" content="#0d0d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
:root{
  --bg:#0d0d12; --card:#17171f; --line:#2a2a36; --txt:#eceaf0;
  --dim:#8d8a99; --acc:#4fd1c5; --ok:#2f6f63;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px; overscroll-behavior-y:contain}
body{padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 30px)}
header{display:flex; align-items:center; justify-content:space-between; margin:0 2px 14px}
h1{font-size:20px; margin:0; letter-spacing:-.4px}
h2{font-size:13px; margin:0 0 10px; color:var(--dim); text-transform:uppercase; letter-spacing:1.1px; font-weight:600}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px}
.hidden{display:none !important}
.btn{appearance:none; border:1px solid var(--line); background:#22222c; color:var(--txt);
  border-radius:12px; padding:12px 14px; font-size:15px; font-weight:600; cursor:pointer; touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--acc); color:#062521; border-color:var(--acc); font-size:17px; padding:16px}
.btn.ghost{background:transparent; color:var(--dim)}
.wide{display:block; width:100%; text-align:center}
.mini{font-size:13px; padding:8px 11px; font-weight:500}
.row{display:flex; gap:8px; margin-top:10px}
.row .btn{flex:1}
input[type=text],input[type=password]{width:100%; background:#0f0f16; border:1px solid var(--line);
  color:var(--txt); border-radius:12px; padding:12px; font-size:15px; outline:none}
#letters{font-size:24px; letter-spacing:8px; text-align:center; text-transform:uppercase; font-weight:700}
#chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.chip{width:46px; height:46px; border-radius:11px; border:1px solid var(--line);
  background:#242430; color:var(--txt); font-size:19px; font-weight:700; cursor:pointer}
#lens{display:flex; gap:8px; margin-bottom:10px}
#lens .btn{flex:1; font-size:16px; padding:12px 0}
#slots{display:flex; flex-wrap:wrap; gap:8px}
.slot{display:flex; align-items:center; gap:8px; background:#242430; border:1px solid var(--line);
  border-radius:10px; padding:7px 9px; font-size:14px}
.slot span{color:var(--dim); cursor:pointer; font-size:16px; padding:0 2px}
#preview{width:100%; border-radius:12px; margin-top:10px; display:block; cursor:zoom-in}
.count{color:var(--acc); font-weight:700}
.words{display:flex; flex-wrap:wrap; gap:7px}
.word{background:#242430; border:1px solid var(--line); color:var(--txt); border-radius:9px;
  padding:9px 12px; font-size:16px; font-weight:700; letter-spacing:.5px; cursor:pointer}
.word.done{background:var(--ok); border-color:var(--ok)}
.muted{color:var(--dim); font-size:14px; margin:0}
#read{font-size:13px; color:var(--dim); margin-top:8px; min-height:16px}
#banner{background:#1d2a29; border:1px solid #2f4a47; color:#bfeee6; border-radius:12px;
  padding:11px 13px; font-size:14px; margin-bottom:10px}
#testOut{font-size:13px; margin-top:8px; color:var(--dim)}
#toast{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px);
  transform:translateX(-50%) translateY(20px); background:#2b2b3a; border:1px solid var(--line);
  padding:11px 18px; border-radius:12px; font-size:14px; opacity:0; transition:.2s; pointer-events:none; z-index:99}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
#viewer{position:fixed; inset:0; background:#000; z-index:50; overflow:auto; display:none}
#viewer.on{display:block}
#viewer img{width:220%; max-width:none; display:block; margin:60px 0}
#viewer .close{position:fixed; top:calc(env(safe-area-inset-top) + 12px); right:12px; z-index:51;
  width:44px; height:44px; border-radius:22px; border:none; background:#ffffff22; color:#fff; font-size:22px}
a{color:var(--acc)}
</style>
</head>
<body>

<header>
  <h1>Solveur</h1>
  <button class="btn mini" id="btnSettings">Réglages</button>
</header>

<section class="card hidden" id="settings">
  <h2>Réglages</h2>
  <p class="muted">Clé API Google AI Studio — <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">en créer une</a>. Elle reste sur ton téléphone.</p>
  <input type="password" id="key" placeholder="AIza… ou AQ…" style="margin-top:8px">
  <input type="text" id="model" placeholder="modèle (laisser vide)" style="margin-top:8px">
  <div class="row">
    <button class="btn" id="testKey">Tester la clé</button>
    <button class="btn ghost" id="saveSettings">Enregistrer</button>
  </div>
  <div class="row">
    <button class="btn ghost" id="closeSettings">Fermer</button>
  </div>
  <div id="testOut"></div>
</section>

<section class="card">
  <h2>Capture du niveau</h2>
  <input type="file" id="shot" accept="image/*" class="hidden">
  <button class="btn primary wide" id="btnShot">Choisir une capture</button>
  <img id="preview" class="hidden" alt="Capture du niveau">
  <div class="row hidden" id="shotActions">
    <button class="btn" id="btnAgain">Relancer l'analyse</button>
    <button class="btn ghost" id="btnDropShot">Retirer</button>
  </div>
  <div id="read"></div>
</section>

<section class="card">
  <h2>Lettres détectées</h2>
  <input id="letters" type="text" inputmode="text" autocapitalize="characters"
         autocomplete="off" spellcheck="false" maxlength="7" placeholder="—">
  <div id="chips"></div>
</section>

<section class="card">
  <h2>Cases à remplir</h2>
  <div id="lens"></div>
  <div id="slots"></div>
  <p class="muted" id="slotHelp">Détection automatique. Corrige en tapant une longueur.</p>
</section>

<section id="out"></section>

<div id="viewer"><button class="close" id="closeViewer">×</button><img id="viewerImg" alt=""></div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const norm = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/[^A-Za-z]/g, '').toUpperCase();
const API = 'https://generativelanguage.googleapis.com/v1beta/models/';

const K = { dict: 'sv.dict', letters: 'sv.letters', slots: 'sv.slots', key: 'sv.key', model: 'sv.model' };
const MODELS = ['gemini-3.8-flash', 'gemini-3.6-flash', 'gemini-2.5-flash'];
let INDEX = null;
let slots = [];

const PROMPT = `Capture d'écran du jeu Wordscapes. Réponds uniquement en JSON.

"letters" : les lettres affichées sur les pastilles du cercle en bas de l'écran, une par entrée, dans l'ordre où elles apparaissent de gauche à droite. Ne devine rien, ne complète pas.
"slots" : pour chaque mot de la grille encore incomplet, son nombre total de cases, du haut vers le bas puis de gauche à droite. Une entrée par mot. Une ligne déjà entièrement remplie est exclue. Une ligne partiellement remplie est incluse avec sa longueur totale.
"note" : une phrase courte si l'image est ambiguë, sinon vide.`;

const SCHEMA = {
  type: 'OBJECT',
  properties: {
    letters: { type: 'ARRAY', items: { type: 'STRING' } },
    slots: { type: 'ARRAY', items: { type: 'INTEGER' } },
    note: { type: 'STRING' }
  },
  required: ['letters', 'slots']
};

/* ---------- dictionnaire ---------- */
function buildIndex() {
  INDEX = new Map();
  const raw = localStorage.getItem(K.dict);
  if (!raw) return;
  for (const w of raw.split('\n')) {
    if (w.length < 3 || w.length > 7) continue;
    const key = w.split('').sort().join('');
    let a = INDEX.get(key);
    if (!a) INDEX.set(key, a = []);
    a.push(w);
  }
}

/* ---------- ui ---------- */
function toast(m) {
  const t = $('toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2200);
}

function renderChips() {
  const v = norm($('letters').value);
  $('letters').value = v;
  localStorage.setItem(K.letters, v);
  $('chips').innerHTML = '';
  [...v].forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = c;
    b.onclick = () => {
      const a = [...$('letters').value]; a.splice(i, 1);
      $('letters').value = a.join(''); renderChips();
    };
    $('chips').append(b);
  });
}

function renderSlots() {
  localStorage.setItem(K.slots, JSON.stringify(slots));
  $('slots').innerHTML = '';
  $('slotHelp').style.display = slots.length ? 'none' : 'block';
  slots.forEach((len, i) => {
    const d = document.createElement('div');
    d.className = 'slot';
    d.innerHTML = '<b>' + len + '</b> cases <span>×</span>';
    d.querySelector('span').onclick = () => { slots.splice(i, 1); renderSlots(); };
    $('slots').append(d);
  });
}

/* ---------- capture ---------- */
$('btnShot').onclick = () => $('shot').click();
$('shot').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  $('preview').src = URL.createObjectURL(f);
  $('preview').classList.remove('hidden');
  $('shotActions').classList.remove('hidden');
  $('letters').value = ''; slots = []; renderChips(); renderSlots();
  $('out').innerHTML = '';
  analyse();
};
$('btnAgain').onclick = analyse;
$('btnDropShot').onclick = () => {
  $('preview').removeAttribute('src');
  $('preview').classList.add('hidden');
  $('shotActions').classList.add('hidden');
  $('read').textContent = '';
};
$('preview').onclick = () => {
  $('viewerImg').src = $('preview').src;
  $('viewer').classList.add('on');
};
$('closeViewer').onclick = () => $('viewer').classList.remove('on');

/* ---------- réglages ---------- */
$('btnSettings').onclick = () => {
  $('key').value = localStorage.getItem(K.key) || '';
  $('model').value = localStorage.getItem(K.model) || '';
  $('testOut').textContent = '';
  $('settings').classList.remove('hidden');
};
$('closeSettings').onclick = () => $('settings').classList.add('hidden');
$('saveSettings').onclick = () => {
  const k = $('key').value.trim(), m = $('model').value.trim();
  if (k) localStorage.setItem(K.key, k); else localStorage.removeItem(K.key);
  if (m) localStorage.setItem(K.model, m); else localStorage.removeItem(K.model);
  $('settings').classList.add('hidden');
  toast('Réglages enregistrés');
};
$('testKey').onclick = async () => {
  const k = $('key').value.trim() || localStorage.getItem(K.key);
  if (!k) { $('testOut').textContent = 'Aucune clé saisie.'; return; }
  $('testOut').textContent = 'Test en cours…';
  try {
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?key=' + encodeURIComponent(k));
    $('testOut').textContent = r.ok ? 'Clé valide.' : 'Clé refusée (code ' + r.status + ').';
  } catch (e) {
    $('testOut').textContent = 'Réseau : ' + (e.message || e);
  }
};

/* ---------- analyse par vision ---------- */
async function shrink(src) {
  const im = new Image();
  im.src = src;
  await im.decode();
  const w = Math.min(1100, im.naturalWidth);
  const h = Math.round(im.naturalHeight * (w / im.naturalWidth));
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(im, 0, 0, w, h);
  return cv.toDataURL('image/jpeg', 0.85).split(',')[1];
}

async function ask(key, model, data, withThinking) {
  const cfg = {
    temperature: 0.1,
    maxOutputTokens: 2048,
    responseMimeType: 'application/json',
    responseSchema: SCHEMA
  };
  if (withThinking) cfg.thinkingConfig = { thinkingBudget: 0 };

  return fetch(API + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(key), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [
        { text: PROMPT },
        { inline_data: { mime_type: 'image/jpeg', data } }
      ] }],
      generationConfig: cfg
    })
  });
}

async function analyse() {
  const key = localStorage.getItem(K.key);
  if (!key) { toast('Ajoute ta clé API dans les réglages'); $('btnSettings').click(); return; }
  const src = $('preview').getAttribute('src');
  if (!src) { toast('Choisis une capture'); return; }
  if (!INDEX) { toast('Dictionnaire manquant'); return; }

  $('read').textContent = 'Analyse de la capture…';
  $('btnAgain').disabled = true;

  try {
    const data = await shrink(src);
    const forced = localStorage.getItem(K.model);
    const list = forced ? [forced] : MODELS;

    let res = null;
    let lastErr = 'aucun modèle disponible';
    for (const model of list) {
      let r = await ask(key, model, data, true);
      if (r.status === 400) r = await ask(key, model, data, false);
      if (r.ok) { res = r; break; }
      lastErr = 'code ' + r.status + ' — ' + (await r.text()).slice(0, 120);
    }
    if (!res) { $('read').textContent = 'Échec : ' + lastErr; return; }

    const j = await res.json();
    if (j.promptFeedback?.blockReason) {
      $('read').textContent = 'Image refusée par le modèle.';
      return;
    }

    const parts = j.candidates?.[0]?.content?.parts || [];
    const txt = parts.filter(p => p.text && !p.thought).map(p => p.text).join('') || '{}';
    const out = JSON.parse(txt);

    const letters = [...new Set(norm((out.letters || []).join('')))].join('');
    const found = (out.slots || []).map(Number).filter(n => n >= 3 && n <= 12);

    if (letters.length < 3 || !found.length) {
      $('read').textContent = 'Détection incomplète — corrige à la main.';
      return;
    }

    $('letters').value = letters;
    slots = found;
    renderChips(); renderSlots();

    $('read').textContent = 'Lettres ' + letters.split('').join(' ') +
      ' · cases ' + found.join(' ') + (out.note ? ' · ' + out.note : '');
    solve();
  } catch (e) {
    $('read').textContent = 'Analyse impossible : ' + (e.message || e);
  } finally {
    $('btnAgain').disabled = false;
  }
}

/* ---------- solveur ---------- */
function* combos(a, k, start = 0, cur = '') {
  if (cur.length === k) { yield cur; return; }
  for (let i = start; i < a.length; i++) yield* combos(a, k, i + 1, cur + a[i]);
}

function solve() {
  const letters = norm($('letters').value);
  if (!INDEX || letters.length < 3 || !slots.length) return;

  const maxL = Math.min(letters.length, 7);
  const byLen = new Map();
  for (let len = 3; len <= maxL; len++) {
    const set = new Set();
    const seen = new Set();
    for (const c of combos(letters, len)) {
      const k = c.split('').sort().join('');
      if (seen.has(k)) continue;
      seen.add(k);
      const ws = INDEX.get(k);
      if (ws) for (const w of ws) set.add(w);
    }
    if (set.size) byLen.set(len, set);
  }
  renderResults(byLen);
}

function copy(w) {
  navigator.clipboard?.writeText(w).then(() => toast('« ' + w + ' » copié'), () => {});
}

function renderResults(byLen) {
  const out = $('out');
  out.innerHTML = '';
  let total = 0;

  const b = document.createElement('div');
  b.id = 'banner';
  b.textContent = 'Vérifie les lettres et les cases. Appuie sur un mot pour le copier.';
  out.append(b);

  slots.forEach(len => {
    const set = byLen.get(len) || new Set();
    total += set.size;
    const card = document.createElement('section');
    card.className = 'card';
    card.innerHTML = '<h2>' + len + ' cases — <span class="count">' + set.size + '</span></h2>';
    const wrap = document.createElement('div');
    wrap.className = 'words';
    if (!set.size) wrap.innerHTML = '<p class="muted">Aucun mot.</p>';
    [...set].sort().forEach(w => {
      const btn = document.createElement('button');
      btn.className = 'word'; btn.textContent = w;
      btn.onclick = () => { copy(w); btn.classList.add('done'); };
      wrap.append(btn);
    });
    card.append(wrap);
    out.append(card);
  });

  const bonus = [];
  for (const [len, set] of byLen) if (!slots.includes(len)) bonus.push(...set);
  if (bonus.length) {
    const card = document.createElement('section');
    card.className = 'card';
    card.innerHTML = '<h2>Mots bonus — <span class="count">' + bonus.length + '</span></h2>';
    const wrap = document.createElement('div');
    wrap.className = 'words';
    bonus.sort((a, c) => a.length - c.length || a.localeCompare(c)).forEach(w => {
      const btn = document.createElement('button');
      btn.className = 'word'; btn.textContent = w;
      btn.onclick = () => { copy(w); btn.classList.add('done'); };
      wrap.append(btn);
    });
    card.append(wrap);
    out.append(card);
  }
  toast(total + ' mot(s) pour la grille');
}

/* ---------- branchements ---------- */
[3, 4, 5, 6, 7].forEach(n => {
  const b = document.createElement('button');
  b.className = 'btn'; b.textContent = n;
  b.onclick = () => { if (slots.length < 12) { slots.push(n); renderSlots(); solve(); } };
  $('lens').append(b);
});

$('letters').oninput = renderChips;
$('letters').onchange = solve;

buildIndex();
$('letters').value = localStorage.getItem(K.letters) || '';
slots = JSON.parse(localStorage.getItem(K.slots) || '[]');
renderChips(); renderSlots();
if (!localStorage.getItem(K.key)) $('settings').classList.remove('hidden');

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
